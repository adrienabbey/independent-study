# Example code from ChatGPT
# Deploys my example container from my GitLab repo.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: repo-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repo-test
  template:
    metadata:
      labels:
        app: repo-test
    spec:
      containers:
        - name: repo-test
          image: registry.gitlab.sevriem.net/sevriem/independent-study/repo-test:latest
          ports:
            - containerPort: 8000
      # Only include the imagePullSecrets if your registry requires authentication.
      imagePullSecrets:
        - name: gitlab-registry
