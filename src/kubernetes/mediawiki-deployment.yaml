apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediawiki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mediawiki
  template:
    metadata:
      labels:
        app: mediawiki
    spec:
      initContainers:
        - name: init-copy-mediawiki
          image: mediawiki:latest
          command: ["sh", "-c", "cp -r /var/www/html/* /mediawiki-data"]
          volumeMounts:
            - name: mediawiki-storage
              mountPath: /mediawiki-data
      containers:
        - name: mediawiki
          image: mediawiki:latest
          ports:
            - containerPort: 80
          env:
            - name: MEDIAWIKI_DB_TYPE
              value: mysql
            - name: MEDIAWIKI_DB_HOST
              value: mariadb
            - name: MEDIAWIKI_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mediawiki-secret
                  key: db-name
            - name: MEDIAWIKI_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mediawiki-secret
                  key: db-user
            - name: MEDIAWIKI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mediawiki-secret
                  key: db-password
          volumeMounts:
            - name: mediawiki-storage
              mountPath: /var/www/html
      volumes:
        - name: mediawiki-storage
          persistentVolumeClaim:
            claimName: mediawiki-pvc
